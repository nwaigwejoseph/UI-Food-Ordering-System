<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf7f2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Righteous&family=Roboto+Serif:opsz,wght@8..144,600&family=Secular+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Create account | U.I Cafe</title>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.4-1l1.8-6.4H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol><symbol id="i-funnel" viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.4V19l-3.6-1.8v-4.8z"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6a9.6 9.6 0 0 1 1.4-.1c6 0 9.5 6.1 9.5 6.1a16 16 0 0 1-3.2 3.7M6.6 7.4A16 16 0 0 0 2.5 12s3.5 6.5 9.5 6.5c1.5 0 2.8-.4 4-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol><symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.2a1.5 1.5 0 0 0 1.5 1.3h7a1.5 1.5 0 0 0 1.5-1.3L18 7M9 7V4.5h6V7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol><symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5v10"/><circle cx="12" cy="19" r="1" fill="currentColor"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol><symbol id="i-cup" viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9Z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 4.5v2M11 4.5v2"/></symbol><symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></symbol><symbol id="i-queue" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H10M15 8l4 4-4 4M19 12H9"/></symbol><symbol id="i-bank" viewBox="0 0 24 24"><path d="M3.5 9.5 12 4l8.5 5.5M5.5 10v7M10 10v7M14 10v7M18.5 10v7M3.5 20h17"/></symbol><symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10.5h18M6.5 15h3"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-door" viewBox="0 0 24 24"><path d="M10 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H10M15 8l4 4-4 4M19 12H9"/></symbol></svg>
    <div class="app app--auth">
        <header class="topbar"><a class="brand" href="welcome.html" aria-label="U.I Cafe, University of Ibadan"><span class="brand__badge" aria-hidden="true">UI</span><span class="brand__text"><b>U.I CAFE</b><small>University of Ibadan</small></span></a></header>

        <main class="auth">
            <h1 class="auth__title">Create your account</h1>
            <p class="auth__lead">Order campus meals, enjoy automatic student discounts, and skip the cafeteria queue.</p>

            <form id="signup-form" data-form="signup" action="#" method="post" novalidate>
                <div class="field-group">
                    <div class="field-card">
                        <div class="field-card__head"><label for="signup-name">Full name</label></div>
                        <div class="field-card__row"><input type="text" id="signup-name" name="full_name" data-rule="name" placeholder="e.g. Aderonke Babatunde" autocomplete="name" aria-describedby="signup-name-error" required ></div>
                    </div>
                    <p class="field-error" id="signup-name-error"></p>
                </div>
                <div class="field-group">
                    <div class="field-card">
                        <div class="field-card__head"><label for="signup-matric">Matric / Staff ID</label></div>
                        <div class="field-card__row"><input type="text" id="signup-matric" name="matric_number" data-rule="matric" placeholder="e.g. 219084 or UI/ST/441" autocomplete="username" aria-describedby="signup-matric-error" required maxlength="20" autocapitalize="characters"><span class="icon-tile" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg></span></div>
                    </div>
                    <p class="field-error" id="signup-matric-error"></p>
                </div>
                <div class="field-group">
                    <div class="field-card">
                        <div class="field-card__head"><label for="signup-password">Password</label></div>
                        <div class="field-card__row"><input type="password" id="signup-password" name="password" data-rule="new-password" placeholder="Enter password" autocomplete="new-password" aria-describedby="signup-password-error" required minlength="8"><button type="button" class="toggle-password icon-tile" aria-controls="signup-password" aria-pressed="false" aria-label="Show password" data-label="password"><svg class="i" aria-hidden="true"><use href="#i-eye-off"/></svg></button></div>
                    </div>
                    <p class="field-error" id="signup-password-error"></p>
                </div>
                <div class="field-group">
                    <div class="field-card">
                        <div class="field-card__head"><label for="signup-confirm">Confirm password</label></div>
                        <div class="field-card__row"><input type="password" id="signup-confirm" name="confirm_password" data-rule="confirm" placeholder="Confirm password" autocomplete="new-password" aria-describedby="signup-confirm-error" required minlength="8"><button type="button" class="toggle-password icon-tile" aria-controls="signup-confirm" aria-pressed="false" aria-label="Show confirm password" data-label="confirm password"><svg class="i" aria-hidden="true"><use href="#i-eye-off"/></svg></button></div>
                    </div>
                    <p class="field-error" id="signup-confirm-error"></p>
                </div>
                <button type="submit" id="btn-signup-submit" class="btn btn-signin btn-split">
                    <span class="left"><span class="tile"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg></span><span class="label">Sign up</span></span>
                    <svg class="i" aria-hidden="true"><use href="#i-chev-r"/></svg>
                </button>
            </form>
        </main>

        <footer class="auth-foot"><p style="margin:0">Have an account? <a href="signin.html">Sign in</a></p></footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
